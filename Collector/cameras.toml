# CCTV 이미지 수집 설정
#
# 카메라는 번호(id)만 적습니다. 이름·좌표·스트림 주소는 실행할 때
# 인천교통정보센터 목록 API로 조회해서 url_cache.json에 저장합니다.
# 따라서 스트림 주소가 바뀌어도 설정 파일을 고칠 필요가 없습니다.
#
# 선정 근거: Screening/screen_fitic.py 로 237대를 자동 선별 후 육안 검수 (2026-09-21)
# 화각이 도는(PTZ) 부평사거리(50), 영종도삼목지하차도(234)는 제외했습니다.

[settings]
interval_minutes = 20          # 캡처 간격(분). 정각 기준(00,20,40). 60의 약수만 허용
save_dir = 'data/images'      # 상대경로면 저장소 루트 기준 (Windows·Linux 공용)
log_dir  = 'data/logs'
timeout_sec = 20               # 스트림 열기·프레임 읽기 타임아웃(초)
retry_count = 2                # 한 회차 안에서 재시도할 최대 횟수
retry_wait_sec = 10            # 재시도 간격(초). 10 미만은 허용하지 않음
warn_after_failures = 3        # 같은 카메라가 이 회차 수만큼 연속 실패하면 알림 1회
min_sun_altitude_deg = 0.0     # 태양고도가 이 값 미만인 카메라는 건너뜀 (야간 제외)
jpeg_quality = 95              # 저장 품질. 원경의 미세한 대비가 곧 신호라 낮추면 신호가 함께 뭉개짐

